[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "srh-session-broker"
version = "0.7.0"
description = "Claude Code ↔ Codex session broker: hand off work and messages by session name (MCP server, herdr plugin, dashboards)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "SRH Solutions" }]
keywords = ["claude-code", "codex", "mcp", "ai-agents", "multi-agent", "herdr", "herdr-plugin", "broker"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
dependencies = [
    "mcp>=2.2,<3",
]

[project.urls]
Homepage = "https://srhsol.com"
Repository = "https://github.com/SRHSolution/srh-session-broker"
Issues = "https://github.com/SRHSolution/srh-session-broker/issues"

[project.optional-dependencies]
jev = ["typesafe-sdk>=0.7.2,<0.8"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "typesafe-sdk>=0.7.2,<0.8"]
screenshots = ["playwright>=1.47", "pillow>=10"]

[project.scripts]
srhbroker = "srhbroker.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/srhbroker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
